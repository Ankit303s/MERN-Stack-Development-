<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Records 2023</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="card blue">
            <h2>₹ <span class="count" data-target="5000000">0</span> LACS</h2>
            <p>Highest Package so far offered by Paloalto Networks</p>
        </div>
        <div class="card purple">
            <h2><span class="count" data-target="2375">0</span></h2>
            <p>TOTAL JOB OFFERS for Batch 2023</p>
        </div>
        <div class="card orange">
            <h2><span class="count" data-target="200">0</span>+</h2>
            <p>Campus Placement Drives for Batch 2023</p>
        </div>
        <div class="card red">
            <h2><span class="count" data-target="345">0</span>+</h2>
            <p>High Package Job Offers ranging from ₹ 7 LACS to ₹ 50 LACS (CTC)</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
